<div class="scorecard-container">
  @if (scoreCard$ | async; as scoreCard) {
    <mat-card class="scorecard">
      <mat-card-header>
        <mat-card-title>Game Scorecard</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-list>
          <h3 mat-subheader>Previous Turns</h3>
          @for (score of scoreCard.turns; track $index) {
            <mat-list-item>
              <span matListItemTitle>Turn {{ $index + 1 }}</span>
              <span matListItemLine>{{ score }} points</span>
            </mat-list-item>
          }
          <mat-divider></mat-divider>
          <mat-list-item class="total-score">
            <span matListItemTitle class="total-label">Total Score</span>
            <span class="total-value">{{ scoreCard.total }}</span>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>
  }
</div>
