<div class="turn-container">
  <mat-card class="current-score-card">
    <mat-card-content class="current-score">
      <div class="score-value">{{ currentTurnScore$ | async }}</div>
      <div class="score-label">Points</div>
    </mat-card-content>
  </mat-card>

  <div class="scoring-buttons">
    @for (option of scoringOptions; track $index) {
      <div>
        <button
          mat-raised-button
          color="accent"
          class="scoring-btn"
          (click)="addScore(option)">
          {{ option.label }}
          @if (option.points > 0) {
            <span class="points-badge">{{ option.points }}</span>
          }
        </button>
      </div>
    }
  </div>

  <div class="action-buttons">
    <button mat-raised-button color="primary" (click)="bankTurn()" class="action-btn bank-btn">
      Bank
    </button>
    <button mat-raised-button color="warn" (click)="farkle()" class="action-btn farkle-btn">
      Farkle
    </button>
  </div>
</div>
