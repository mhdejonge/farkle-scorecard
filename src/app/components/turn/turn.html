<div class="turn-container">
  <mat-card class="current-score-card">
    <mat-card-content class="current-score">
      <div class="score-value">{{ currentScore() }}</div>
      <div class="score-label">Points</div>
    </mat-card-content>
  </mat-card>
  <div class="scoring-buttons">
    @for (option of scoringOptions; track $index) {
      <div>
        <button
          matButton="outlined"
          class="scoring-btn"
          (click)="addScore(option)">
          {{ option.label }}
          @if (option.points > 0) {
            <span class="points-badge">{{ option.points }}</span>
          }
        </button>
      </div>
    }
  </div>
  <div class="action-buttons">
    <button matButton="outlined" (click)="undo()" [disabled]="undoDisabled()">Undo</button>
    <button matButton="outlined" (click)="bank()" [disabled]="bankDisabled()" [ngClass]="{ 'bank-btn': !bankDisabled() }">Bank</button>
    <button matButton="outlined" (click)="farkle()" [disabled]="farkleDisabled()" [ngClass]="{ 'farkle-btn': !farkleDisabled() }">Farkle</button>
  </div>
</div>
