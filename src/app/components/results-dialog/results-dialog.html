<div class="results-dialog">
  <h2 [ngClass]="isBanking ? 'success-title' : 'failure-title'">
    <div class="title-content">
      {{ title }}
    </div>
  </h2>
  <mat-dialog-content>
    <div
      class="content-container"
      [ngClass]="isBanking ? 'success-content' : 'failure-content'">
      <div class="points-display" [ngClass]="isBanking ? 'success-points' : 'failure-points'">
        {{ pointsDisplay }}
      </div>
      <div class="description">{{ description }}</div>
    </div>
  </mat-dialog-content>
</div>
